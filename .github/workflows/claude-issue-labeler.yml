name: Claude Issue Labeler

on:
  issues:
    types: [opened, edited]

jobs:
  label-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude to label issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (título y cuerpo), y del código del proyecto si hace falta contexto, para hacer dos cosas:

            1. Labels: asígnale las labels apropiadas ejecutando `gh issue edit`.
               Labels preferidas (usa estas siempre que apliquen, puedes asignar una o varias):
               - bug: reporta un comportamiento incorrecto o error
               - enhancement: solicita una mejora o nueva funcionalidad
               - documentation: relacionado con el README u otra documentación
               - question: es una pregunta o solicitud de aclaración
               Si además consideras que hace falta otra label para describir correctamente el issue (por ejemplo por área del código, prioridad, etc.), créala con `gh label create` (nombre breve, en minúsculas, estilo kebab-case) y asígnala. Antes de crear una, revisa con `gh label list` si ya existe una equivalente en el repo para no duplicar. Si el issue tiene labels que ya no aplican según el contenido actual, quítalas.

            2. Descripción técnica: publica un comentario nuevo en el issue con `gh issue comment` que incluya una descripción técnica clara y precisa que ayude al equipo de desarrollo a entender el problema o solicitud. Basándote en el código de este repositorio (`game.js`, `index.html`), señala qué parte del sistema está probablemente involucrada, posibles causas o consideraciones técnicas relevantes, y cualquier ambigüedad que el autor debería aclarar. No reescribas ni edites el título/cuerpo original del issue, solo añade el comentario.

            No repitas el comentario técnico si ya existe uno tuyo previo en el issue con ese análisis; en tal caso solo actualiza labels si corresponde.
          claude_args: '--allowedTools "Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*)"'
